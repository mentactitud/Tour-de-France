name: Desplegar en GitHub Pages

on:
  push:
    branches: [main, claude/hunting-tracker-app-di9gtr]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Asegurar que .well-known y .nojekyll estén en dist
        run: |
          mkdir -p dist/.well-known
          cp public/.well-known/assetlinks.json dist/.well-known/assetlinks.json
          touch dist/.nojekyll
      - name: Construir variante compartir (sin datos personales)
        run: VITE_VARIANTE=compartir npx vite build --outDir dist/compartir
      - name: Comprobar que la variante compartir no lleva el histórico
        run: |
          if grep -rq '"source": "excel"\|2023-08-20' dist/compartir/assets/; then
            echo "::error::La variante compartir contiene datos del histórico" && exit 1
          fi
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
